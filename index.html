<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#100d2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./marea-icon.svg">
  <meta name="description" content="MAREA — juego de surf creado por nachommmartinez.">
  <title>MAREA — surf infinito</title>
  <link rel="stylesheet" href="./style.css?v=15">
</head>
<body>
  <main id="game" aria-label="MAREA, juego de surf creado por nachommmartinez">
    <canvas id="screen" width="1280" height="720" aria-label="Ola y surfista"></canvas>
    <div id="start" class="overlay">
      <div class="panel">
        <div class="eyebrow">SURF INFINITO</div>
        <h1>MAREA</h1>
        <div class="byline">CREADO POR NACHOMMMARTINEZ</div>
        <div class="choose-title">ELIGE SURFISTA</div>
        <div class="characters" role="group" aria-label="Elegir surfista">
          <button class="character selected" type="button" data-character="0" aria-pressed="true"><img class="portrait-art" src="./portraits/rubio.svg?v=8" alt="" width="74" height="82"><strong>RUBIO</strong><small>OJOS TURQUESA</small></button>
          <button class="character" type="button" data-character="1" aria-pressed="false"><img class="portrait-art" src="./portraits/punk.svg?v=7" alt="" width="74" height="82"><strong>PUNK</strong><small>OJOS LIMA</small></button>
          <button class="character" type="button" data-character="2" aria-pressed="false"><img class="portrait-art" src="./portraits/atlas.svg?v=7" alt="" width="74" height="82"><strong>ATLAS</strong><small>OJOS ÁMBAR</small></button>
          <button class="character" type="button" data-character="3" aria-pressed="false"><img class="portrait-art" src="./portraits/yuna.svg?v=7" alt="" width="74" height="82"><strong>YUNA</strong><small>OJOS CIELO</small></button>
        </div>
        <div class="choose-title board-title">ELIGE TABLA</div>
        <div class="boards" role="group" aria-label="Elegir tabla">
          <button type="button" data-board="0" aria-pressed="true" aria-label="Tabla rosa"><span class="board-swatch" style="--board:#f368a5"></span><span>ROSA</span></button>
          <button type="button" data-board="1" aria-pressed="false" aria-label="Tabla turquesa"><span class="board-swatch" style="--board:#38c9c6"></span><span>TURQUESA</span></button>
          <button type="button" data-board="2" aria-pressed="false" aria-label="Tabla dorada"><span class="board-swatch" style="--board:#edb65d"></span><span>DORADA</span></button>
          <button type="button" data-board="3" aria-pressed="false" aria-label="Tabla violeta"><span class="board-swatch" style="--board:#a68be8"></span><span>VIOLETA</span></button>
        </div>
        <p>Toca un pájaro blanco al saltar: +1000 puntos.<br>En la gran ola, aterriza un backflip para ganar +1000 y velocidad.</p>
        <span class="small">Juega en vertical. Al girar el móvil, se intentará abrir en pantalla completa.</span>
        <button id="startButton" type="button">ENTRAR AL AGUA</button>
      </div>
    </div>
    <div id="gameOver" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="panel scores-panel">
        <div class="eyebrow">FIN DE LA OLA</div>
        <h2 id="gameOverTitle">RÉCORDS</h2>
        <p id="finalScore"></p>
        <form id="scoreForm" class="score-form hidden">
          <label for="initials">TUS INICIALES · 3 LETRAS</label>
          <div><input id="initials" type="text" minlength="3" maxlength="3" pattern="[A-Za-z]{3}" autocomplete="off" autocapitalize="characters" spellcheck="false" required aria-label="Tres iniciales"><button type="submit">GUARDAR</button></div>
        </form>
        <ol id="highscores" aria-label="Diez mejores puntuaciones"></ol>
        <button id="replayButton" type="button">OTRA OLA</button>
        <button id="changeCharacterButton" type="button">CAMBIAR SURFISTA</button>
      </div>
    </div>
    <button id="fullscreenButton" class="fullscreen-button hidden" type="button" aria-label="Activar pantalla completa">⛶ PANTALLA COMPLETA</button>
    <button id="soundButton" class="sound" type="button" aria-label="Silenciar música">♫</button>
    <div id="fullscreenTip" class="fullscreen-tip hidden" role="status"></div>
  </main>
  <audio id="music" src="./audio/marea_ambient.ogg" preload="auto" loop></audio>
  <audio id="musicNight" src="./audio/marea_noche.ogg" preload="auto" loop></audio>
  <audio id="musicStorm" src="./audio/marea_tormenta.ogg" preload="auto" loop></audio>
  <script src="./game.js?v=38" defer></script>
</body>
</html>
