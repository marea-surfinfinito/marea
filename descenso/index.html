<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061723"><title>DESCENSO — inmersión infinita</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061723;color:#e4f4ed;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}button{font:700 13px Arial,sans-serif;letter-spacing:.08em;color:#e4f4ed;background:#0b3344cc;border:1px solid #99d5ce;padding:12px 16px;cursor:pointer}button:focus-visible{outline:2px solid white}.top{position:fixed;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:16px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.top>*{pointer-events:auto}.back{color:#d6eee7;text-decoration:none;font:700 12px monospace;letter-spacing:.13em;text-shadow:0 2px 5px #001}.back:hover{text-decoration:underline}.hud{font:12px monospace;letter-spacing:.12em;text-align:right;text-shadow:0 2px 5px #001}.intro{position:fixed;inset:0;display:grid;place-items:center;background:#04131ec9;padding:24px}.intro.hidden{display:none}.panel{max-width:510px;text-align:center}.eyebrow{font:12px monospace;letter-spacing:.3em;color:#8bd5cb}.panel h1{font-size:clamp(58px,13vw,112px);letter-spacing:-.07em;line-height:1;margin:18px 0}.panel p{font-size:16px;line-height:1.55;color:#c9e2e1}.panel button{margin:18px 0}.panel small{display:block;font-size:13px;line-height:1.6;color:#a2c8c9}.touch{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:16px;right:16px;display:none;justify-content:space-between;align-items:end;pointer-events:none}.touch div{display:flex;gap:8px}.touch button{pointer-events:auto;min-width:58px;min-height:58px;font-size:19px;touch-action:none;user-select:none}@media(pointer:coarse){.touch{display:flex}.hud{font-size:11px}}
</style></head><body><canvas id="sea" aria-label="Exploración submarina procedural"></canvas><div class="top"><a class="back" href="../">← JUEGOS</a><div class="hud"><span id="depth">0 m</span><br><span id="seed"></span></div></div><div class="touch" aria-label="Controles de movimiento"><div><button data-key="left" aria-label="Nadar a la izquierda">←</button><button data-key="right" aria-label="Nadar a la derecha">→</button></div><div><button data-key="down" aria-label="Descender">↓</button><button data-key="up" aria-label="Ascender">↑</button></div></div><div class="intro" id="intro"><div class="panel"><span class="eyebrow">INMERSIÓN 01</span><h1>DESCENSO</h1><p>Un océano distinto en cada viaje. Nada, desciende y observa. No hay objetivos ni límite de tiempo.</p><button id="start">SUMERGIRSE</button><small>Teclado: WASD o flechas · En móvil: botones en pantalla<br>Deja de pulsar para flotar.</small></div></div><script>
(()=>{'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false}),depthEl=document.querySelector('#depth'),seedEl=document.querySelector('#seed'),intro=document.querySelector('#intro');let W=0,H=0,dpr=1,active=false,last=0,t=0;const seed=(Math.random()*4294967295)>>>0;seedEl.textContent='MAR '+seed.toString(36).toUpperCase().slice(0,6);const p={x:0,y:62,vx:0,vy:0,face:1};const keys=new Set();const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,q)=>a+(b-a)*q;
function hash(n){let x=(n^seed)>>>0;x=Math.imul(x^x>>>16,0x7feb352d);x=Math.imul(x^x>>>15,0x846ca68b);return((x^x>>>16)>>>0)/4294967296}
function noise(x){const i=Math.floor(x),f=x-i,s=f*f*(3-2*f);return lerp(hash(i),hash(i+1),s)}
function bottom(x){return 330+65*(noise(x/240)-.5)+110*(noise(x/750)-.5)+130*(noise(x/1700)-.5)}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function keyOf(k){return({ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'})[k]}
addEventListener('keydown',e=>{const k=keyOf(e.key);if(k){keys.add(k);e.preventDefault()}});addEventListener('keyup',e=>{const k=keyOf(e.key);if(k){keys.delete(k);e.preventDefault()}});addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(k))});
document.querySelector('#start').onclick=()=>{intro.classList.add('hidden');active=true;last=performance.now();requestAnimationFrame(frame)};
function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;t+=dt;update(dt);draw();requestAnimationFrame(frame)}
function update(dt){let ax=(keys.has('right')?1:0)-(keys.has('left')?1:0),ay=(keys.has('down')?1:0)-(keys.has('up')?1:0);p.vx+=(ax*175-p.vx*1.8)*dt;p.vy+=(ay*135-p.vy*1.85)*dt;p.x+=p.vx*dt;p.y=clamp(p.y+p.vy*dt,12,2400);if(p.y===12)p.vy=Math.max(0,p.vy);if(Math.abs(p.vx)>8)p.face=Math.sign(p.vx);depthEl.textContent=Math.floor(p.y)+' m'}
function draw(){const camX=p.x-W*.5,camY=p.y-H*.49,deep=clamp(p.y/1300,0,1);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,deep>.5?'#061a2b':'#266978');sky.addColorStop(1,'#03111e');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-camX,-camY);
const surface=0;ctx.fillStyle='#9fdfd3';ctx.globalAlpha=clamp(.6-deep,0,.6);for(let x=Math.floor(camX/40)*40;x<camX+W+40;x+=40){ctx.beginPath();ctx.moveTo(x,surface+Math.sin(x*.025+t)*3);ctx.lineTo(x+40,surface+Math.sin((x+40)*.025+t)*3);ctx.strokeStyle='#b1e9d9';ctx.lineWidth=2;ctx.stroke()}ctx.globalAlpha=1;
if(p.y<520){for(let i=-2;i<7;i++){let x=(i*230+hash(i+33)*170)+Math.floor(camX/1300)*1300;ctx.fillStyle='rgba(137,218,212,.025)';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+170,0);ctx.lineTo(x+360,650);ctx.lineTo(x+110,650);ctx.fill()}}
const x0=Math.floor((camX-100)/12)*12,x1=camX+W+120;
for(let layer=0;layer<3;layer++){const shift=(layer-1)*60,scale=layer===0?.65:layer===1?.83:1;ctx.beginPath();ctx.moveTo(x0,camY+H+700);for(let x=x0;x<=x1;x+=12)ctx.lineTo(x,bottom(x+shift)*scale+shift+160);ctx.lineTo(x1,camY+H+700);ctx.closePath();ctx.fillStyle=['#194052','#123345','#0a2938'][layer];ctx.fill()}
const left=Math.floor((camX-200)/85),right=Math.ceil((camX+W+200)/85);for(let i=left;i<=right;i++){let x=i*85+hash(i+11)*40,y=bottom(x),h=25+hash(i+7)*95;if(hash(i+3)>.39){ctx.strokeStyle=deep>.7?'#244e55':'#396f6c';ctx.lineWidth=2+hash(i+5)*3;ctx.beginPath();ctx.moveTo(x,y);for(let j=1;j<=5;j++){let yy=y-h*j/5;ctx.lineTo(x+Math.sin(t*.75+i+j*.4)*j*2,yy)}ctx.stroke();for(let j=1;j<=3;j++){let yy=y-h*j/4;ctx.beginPath();ctx.moveTo(x,yy);ctx.quadraticCurveTo(x+20*Math.sin(i+j),yy-13,x+26*Math.sin(i+j),yy-20);ctx.stroke()}}else if(hash(i+9)>.7){ctx.fillStyle='#366166';ctx.beginPath();ctx.ellipse(x,y-8,16+hash(i)*17,9,0,0,TAU);ctx.fill()}}
for(let i=Math.floor((camX-200)/175);i<(camX+W+200)/175;i++){let x=i*175+hash(i+450)*140+Math.sin(t*(.3+hash(i+4)*.3)+i)*18,y=65+hash(i+980)*Math.min(680,p.y+350)+Math.sin(t+i)*9;if(Math.abs(y-p.y)>H*.8+200)continue;let n=2+Math.floor(hash(i+99)*6),dir=hash(i+9)>.5?1:-1;for(let j=0;j<n;j++){let fx=x+j*12*dir+Math.sin(t+i+j)*4,fy=y+(hash(i*17+j)-.5)*34,sz=3+hash(i+j+170)*6;ctx.fillStyle=hash(i+7)>.7?'#b2d5bc':'#75aaa9';ctx.globalAlpha=clamp(.8-Math.abs(fy-p.y)/1000,.12,.8);ctx.beginPath();ctx.ellipse(fx,fy,sz*1.6,sz*.6,0,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(fx-dir*sz,fy);ctx.lineTo(fx-dir*sz*2,fy-sz*.6);ctx.lineTo(fx-dir*sz*2,fy+sz*.6);ctx.fill()}ctx.globalAlpha=1}
for(let i=0;i<110;i++){let x=(hash(i+3000)*2800+Math.floor(camX/2800)*2800),y=(hash(i+5000)*1500+Math.floor(camY/1500)*1500);for(let dx of [-2800,0,2800])for(let dy of [-1500,0,1500]){let px=x+dx,py=y+dy;if(px<camX||px>camX+W||py<camY||py>camY+H)continue;ctx.fillStyle='rgba(176,231,222,.25)';ctx.fillRect(px+Math.sin(t+i)*8,py-t*6%70,1.5,1.5)}}
ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.face,1);const kick=Math.sin(t*4.5)*(Math.abs(p.vx)+Math.abs(p.vy)>15?1:.3);ctx.strokeStyle='#a1d5c7';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,9);ctx.lineTo(-21,13+kick*4);ctx.lineTo(-29,10+kick*8);ctx.moveTo(-8,13);ctx.lineTo(-22,18-kick*3);ctx.lineTo(-30,17-kick*7);ctx.stroke();ctx.fillStyle='#f2b764';ctx.beginPath();ctx.ellipse(0,0,14,8,-.15,0,TAU);ctx.fill();ctx.fillStyle='#0b2d3d';ctx.fillRect(-6,-6,15,11);ctx.fillStyle='#d0e6d6';ctx.beginPath();ctx.arc(15,-3,6,0,TAU);ctx.fill();ctx.fillStyle='#153a48';ctx.fillRect(18,-5,3,4);ctx.restore();for(let i=0;i<8;i++){let age=(t*.35+i/8)%1,x=p.x-20-age*(25+Math.abs(p.vx)*.3)+Math.sin(i*4)*8,y=p.y-10-age*75;ctx.strokeStyle='rgba(190,236,228,'+(.45*(1-age))+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,2+age*5,0,TAU);ctx.stroke()}ctx.restore();
let vignette=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.12,W/2,H/2,Math.max(W,H)*.8);vignette.addColorStop(0,'rgba(0,10,22,0)');vignette.addColorStop(1,'rgba(0,7,18,.73)');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H)}
draw()})();
</script></body></html>
