<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061723"><title>Descenso — en desarrollo</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#174559,#061723 70%);color:#e5f3ee;font-family:Arial,sans-serif;text-align:center;padding:24px}main{max-width:560px}small{font:700 13px monospace;letter-spacing:.25em;color:#97cec8}h1{font-size:clamp(58px,14vw,110px);letter-spacing:-.07em;margin:22px 0}p{font-size:19px;color:#bed8d7;line-height:1.5}a{display:inline-block;color:#e5f3ee;border:1px solid #8ccbc4;text-decoration:none;padding:13px 20px;margin-top:22px;font:700 13px monospace;letter-spacing:.08em}</style></head><body><main><small>PRÓXIMA INMERSIÓN</small><h1>DESCENSO</h1><p>En desarrollo. El océano aún está tomando forma.</p><a href="../juegos/">← VOLVER A LOS JUEGOS</a></main><style id="global-lang-style">#global-lang{position:fixed;top:14px;right:14px;z-index:99999;background:rgba(0,0,0,.75);border:1px solid #777;padding:5px 8px;font:11px Arial,sans-serif;color:#aaa}#global-lang button{border:0;background:transparent;color:#aaa;padding:5px;cursor:pointer}#global-lang button.active{color:#fff;text-decoration:underline}#google_translate_element{position:fixed;left:-9999px;top:-9999px}body{top:0!important}</style><div id="global-lang"><button data-lang="es">ES</button>/<button data-lang="en">EN</button></div><div id="google_translate_element"></div><script id="global-lang-js">(function(){const K="site-lang";function a(l){localStorage.setItem(K,l);document.documentElement.lang=l;document.querySelectorAll("#global-lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));const g=()=>{const s=document.querySelector(".goog-te-combo");if(!s)return false;s.value=l==="es"?"":l;s.dispatchEvent(new Event("change",{bubbles:true}));return true};if(!g()){let n=0,t=setInterval(()=>{if(g()||++n>40)clearInterval(t)},250)}}window.googleTranslateElementInit=()=>{new google.translate.TranslateElement({pageLanguage:"es",includedLanguages:"es,en",autoDisplay:false},"google_translate_element");setTimeout(()=>a(localStorage.getItem(K)||"es"),300)};document.querySelectorAll("#global-lang button").forEach(b=>b.onclick=()=>a(b.dataset.lang));})();</script><script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script></body></html>
